# Giao dien demo (streamlit run app/streamlit_app.py) - phong cach bai bao / cong cu thuc nghiem
[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#1f3a5f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1b1f24"
borderColor = "#d5dbe3"
baseRadius = "0.25rem"
font = "'Noto Sans', sans-serif"
headingFont = "'Noto Serif', serif"
codeFont = "'JetBrains Mono', monospace"

[theme.sidebar]
backgroundColor = "#f3f5f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b1f24"
primaryColor = "#1f3a5f"
borderColor = "#d5dbe3"
